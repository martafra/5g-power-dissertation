<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- mast -->
  <line x1="50" y1="8" x2="50" y2="72" stroke="#00e5ff" stroke-width="4" stroke-linecap="round"/>

  <!-- crossbar -->
  <line x1="32" y1="72" x2="68" y2="72" stroke="#00e5ff" stroke-width="4" stroke-linecap="round"/>

  <!-- left leg -->
  <line x1="32" y1="72" x2="22" y2="92" stroke="#00e5ff" stroke-width="4" stroke-linecap="round"/>

  <!-- right leg -->
  <line x1="68" y1="72" x2="78" y2="92" stroke="#00e5ff" stroke-width="4" stroke-linecap="round"/>

  <!-- signal waves left -->
  <path d="M 40 32 Q 28 42 40 52" fill="none" stroke="#00e5ff" stroke-width="3" stroke-linecap="round"/>
  <path d="M 30 24 Q 12 42 30 60" fill="none" stroke="#00e5ff" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>

  <!-- signal waves right -->
  <path d="M 60 32 Q 72 42 60 52" fill="none" stroke="#00e5ff" stroke-width="3" stroke-linecap="round"/>
  <path d="M 70 24 Q 88 42 70 60" fill="none" stroke="#00e5ff" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>

  <!-- top dot -->
  <circle cx="50" cy="8" r="4" fill="#00e5ff"/>
</svg>
